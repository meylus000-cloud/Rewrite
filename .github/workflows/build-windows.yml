
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --windowed --name SonicRewrite --add-data "assets;assets" main.py

      - name: Include configuration
        shell: pwsh
        run: |
          Copy-Item config.json dist/SonicRewrite/
          Copy-Item Rewrite.safri dist/SonicRewrite/
          Copy-Item README.md dist/SonicRewrite/
          Copy-Item README.txt dist/SonicRewrite/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SonicRewrite-Windows
          path: dist/SonicRewrite/
